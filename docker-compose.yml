x-spring-env: &spring-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

services:
  # ---------- bases de datos (sin puertos publicados) ----------
  postgres-productos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productos
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-productos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d productos"]
      interval: 10s
      retries: 5

  postgres-pedidos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-pedidos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d pedidos"]
      interval: 10s
      retries: 5

  # ---------- infraestructura Spring Cloud ----------
  config-server:
    build: ./config-server
    image: ecommerce/config-server:1.0
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      retries: 10
      start_period: 30s
    restart: on-failure

  eureka-server:
    build: ./eureka-server
    image: ecommerce/eureka-server:1.0
    ports: ["8761:8761"] # panel de Eureka
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 10
      start_period: 30s
    restart: on-failure

  # ---------- microservicios de negocio (sin puertos publicados) ----------
  producto-service:
    build: ./producto-service
    image: ecommerce/producto-service:1.0
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://postgres-productos:5432/productos
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-productos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      retries: 10
      start_period: 40s
    restart: on-failure

  pedido-service:
    build: ./pedido-service
    image: ecommerce/pedido-service:1.0
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://postgres-pedidos:5432/pedidos
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-pedidos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      retries: 10
      start_period: 40s
    restart: on-failure

  # ---------- entrada unica ----------
  api-gateway:
    build: ./api-gateway
    image: ecommerce/api-gateway:1.0
    ports: ["8080:8080"]
    environment: *spring-env
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 10
      start_period: 40s
    restart: on-failure

volumes:
  pg-productos:
  pg-pedidos:
